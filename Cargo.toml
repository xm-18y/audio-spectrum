[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/app", "xtask"]
# 独立复现工程(自持 Cargo.lock/target,不进 workspace 依赖图)。
exclude = ["repro"]

[workspace.package]
version = "0.8.10"
edition = "2024"

[workspace.dependencies]
audio-spectrum-core = { path = "crates/core" }
audio-spectrum-capture = { path = "crates/capture" }
realfft = "3.5"
cpal = "0.18"
ringbuf = "0.5"
iced = "0.14"
objc2-screen-capture-kit = "0.3.2"
libpulse-binding = "2.30.1"
