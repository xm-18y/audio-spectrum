[package]
name = "audio-spectrum-app"
version.workspace = true
edition.workspace = true
description = "audio-spectrum: real-time audio spectrum display for Windows/macOS/Linux."

[dependencies]
iced = { workspace = true, features = ["canvas", "image"] }
audio-spectrum-core = { workspace = true }
audio-spectrum-capture = { workspace = true }

# 构建脚本按宿主平台编译,故 winresource 必须无条件声明(纯 Rust,
# 非 Windows 宿主仅编译不调用);嵌入逻辑由 build.rs 内的目标平台检查守卫。
[build-dependencies]
winresource = "0.1"

[dependencies.serde]
version = "1"
features = ["derive"]

# 应用内更新:GitHub Releases API 与资产下载(rustls,无 openssl 依赖)。
[dependencies.ureq]
version = "2"
default-features = false
features = ["tls"]

[dependencies.serde_json]
version = "1"

[dependencies.ron]
version = "0.12"

[dependencies.dirs]
version = "7"

[dependencies.rfd]
version = "0.17"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = [
    "NSMenu",
    "NSMenuItem",
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSCell",
    "bitflags",
] }

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
