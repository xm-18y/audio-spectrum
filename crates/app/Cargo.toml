[package]
name = "music-spec-app"
version.workspace = true
edition.workspace = true
description = "music-spec: real-time audio spectrum display for Windows/macOS/Linux."

[dependencies]
eframe = { workspace = true }
music-spec-core = { workspace = true }
music-spec-capture = { workspace = true }

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.ron]
version = "0.12"

[dependencies.dirs]
version = "7"

[dependencies.rfd]
version = "0.17"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = [
    "NSMenu",
    "NSMenuItem",
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSCell",
    "bitflags",
] }

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
