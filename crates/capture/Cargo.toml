[package]
name = "music-spec-capture"
version.workspace = true
edition.workspace = true
description = "Capture Backends: platform-specific Input / Loopback capture, normalized to f32/48kHz/mono."

[dependencies]
cpal = { workspace = true }
ringbuf = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-screen-capture-kit = { workspace = true }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
] }
objc2-core-media = { version = "0.3.2", features = [
    "CMSampleBuffer",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { workspace = true }
