name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 统一计算版本标签（形如 v0.2.0-20250115-1030，UTC），
  # 避免三个平台并行计算时出现分钟级不一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version label
        id: label
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          LABEL="v${VERSION}-$(date -u +%Y%m%d-%H%M)"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "版本标签:$LABEL"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux audio build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libclang-dev clang pkg-config

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace

      - name: Bundle .app (macOS)
        if: runner.os == 'macOS'
        env:
          LABEL: ${{ needs.prepare.outputs.version_label }}
        run: |
          ./scripts/bundle-macos.sh
          mkdir -p dist
          ditto -c -k --keepParent target/release/music-spec.app \
            "dist/music-spec-${LABEL}-macos-arm64.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          LABEL: ${{ needs.prepare.outputs.version_label }}
        run: |
          mkdir dist
          Copy-Item target/release/music-spec-app.exe dist/music-spec.exe
          Compress-Archive -Path dist/music-spec.exe -DestinationPath "dist/music-spec-$env:LABEL-windows-x64.zip"
          Remove-Item dist/music-spec.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          LABEL: ${{ needs.prepare.outputs.version_label }}
        run: |
          mkdir -p dist
          tar -czf "dist/music-spec-${LABEL}-linux-x64.tar.gz" -C target/release music-spec-app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-spec-${{ needs.prepare.outputs.version_label }}-${{ matrix.platform }}
          path: dist

      - name: Run summary
        shell: bash
        run: |
          echo "### 构建产物(run 级)" >> "$GITHUB_STEP_SUMMARY"
          echo "已上传为 workflow artifact:[本次运行的 Artifacts 区]" \
            "(${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: publish download links
    needs: [prepare, build]
    # tag push → 该 tag 的正式 release;main/手动 → 滚动 prerelease latest(稳定链接);
    # 其他分支的 push 只出 artifacts。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release (tag) or rolling prerelease (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式版:发布到触发构建的 tag 上,标题附版本标签。
            TAG="${GITHUB_REF#refs/tags/}"
            LABEL="${{ needs.prepare.outputs.version_label }}"
            gh release create "$TAG" \
              --title "music-spec ${TAG} (${LABEL})" \
              --notes "提交:\`${GITHUB_SHA}\`\n版本标签:\`${LABEL}\`\n运行记录:${REPO_URL}/actions/runs/${GITHUB_RUN_ID}" \
              dist/*
          else
            # 滚动标签:同一 URL 永远指向最新构建。
            TAG="latest"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            cat > notes.md <<EOF
          ## music-spec 构建产物

          - 提交:\`${GITHUB_SHA}\`
          - 运行记录:${REPO_URL}/actions/runs/${GITHUB_RUN_ID}
          - 触发:\`${GITHUB_EVENT_NAME}\`
          EOF
            gh release create "$TAG" \
              --prerelease \
              --title "music-spec ${{ needs.prepare.outputs.version_label }}" \
              --notes-file notes.md \
              dist/*
          fi

      - name: Job summary with download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          {
            echo "## 下载链接(${TAG})"
            echo ""
            for f in dist/*; do
              base="$(basename "$f")"
              echo "- [${base}](${REPO_URL}/releases/download/${TAG}/${base})"
            done
            echo ""
            echo "发布页:${REPO_URL}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
